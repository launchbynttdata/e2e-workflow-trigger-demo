name: Playwright Tests
on:
  workflow_call:
    inputs:
      branch-name:
        description: "The branch name to test"
        required: true
        type: string
    outputs:
      e2e-outcome:
        description: "E2E tests outcome, one of 'success', 'failure', 'skipped', 'cancelled'"
        value: ${{ jobs.test.outputs.e2e-outcome }}

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  test:
    outputs:
      e2e-outcome: ${{ steps.run-e2e.outcome }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch-name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore cached node_modules
        uses: actions/cache/restore@v5
        id: cache-node
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Restore cached Playwright browsers
        uses: actions/cache/restore@v5
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright_browsers-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v5
        id: save-node-cache
        if: ${{ steps.cache-node.outputs.cache-hit != 'true' }}
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Cache Playwright browsers
        uses: actions/cache/save@v5
        id: save-playwright-cache
        if: ${{ steps.cache-playwright.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright_browsers-${{ hashFiles('package-lock.json') }}

      - id: run-e2e
        name: Run Playwright tests
        run: npm run e2e

      - id: upload-artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: daun/playwright-report-summary@v3
        if: ${{ !cancelled() }}
        with:
          report-file: playwright-report/test-results.json
          report-url: "${{ steps.upload-artifact.outputs.artifact-url }}"
