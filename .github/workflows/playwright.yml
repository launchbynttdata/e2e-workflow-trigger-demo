name: Playwright Tests
on:
  workflow_call:
    inputs:
      branch-name:
        description: "The branch name to test"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch-name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - id: run-e2e
        name: Run Playwright tests
        run: npm run e2e

      - id: upload-artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - id: create-comment
        name: Create comment with Playright output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<EOC > e2e_comment.md
          > [!IMPORTANT]
          > E2E test run has completed!

          Your test results can be [found here](${{ steps.upload-artifact.outputs.artifact-url }}).
          EOC

          gh pr comment "${PR_NUMBER}" --delete-last
          gh pr comment "${PR_NUMBER}" --create --body-file e2e_comment.md
