on: pull_request

permissions:
  contents: write
  checks: write
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create E2E status check
        uses: launchbynttdata/e2e-workflow-trigger-demo/.github/actions/create-e2e-status-check@main
        with:
          repo: e2e-workflow-trigger-demo
          owner: launchbynttdata
          sha: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Restore cached node_modules
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Cache node_modules
        uses: actions/cache/save@v5
        id: save-cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Lint code
        run: npm run lint
