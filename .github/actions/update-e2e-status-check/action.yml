name: Update E2E Status Check
description: Updates the status check for a commit.
inputs:
  status:
    description: "Status to set on the check, one of 'expected', 'completed', 'in_progress'"
    required: true
  conclusion:
    description: "If the check is in a 'completed' status, provide a conclusion like 'success', 'failure', 'cancelled', etc."
    required: true
  context:
    description: "Context of the status check, e.g. 'E2E'"
    required: true
  sha:
    description: "SHA of the commit on which to create the status check"
    required: true
  repo:
    description: "GitHub repository name"
    required: true
    default: "e2e-workflow-trigger-demo"
  owner:
    description: "GitHub organization or user owning the repository"
    required: true
    default: launchbynttdata
  GITHUB_TOKEN:
    description: "GITHUB_TOKEN for interacting with the GH API"
    required: true
runs:
  using: "composite"
  steps:
    - name: Masking Secret Value
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.GITHUB_TOKEN }}"

    - name: Create status for SHA
      id: create-status
      shell: bash
      run: |
        if [ "${{ inputs.success }}" == "true" ]; then 
          PAYLOAD='{"state":"success","description":"E2E tests have passed","context":"E2E"}'
        else
          PAYLOAD='{"state":"failure","description":"E2E tests have failed!","context":"E2E"}'
        fi
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ inputs.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ inputs.owner }}/${{ inputs.repo }}/statuses/${{ inputs.sha }} \
          -d "${PAYLOAD}"
